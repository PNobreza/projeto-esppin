name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Aciona o workflow quando há um commit na branch main
  workflow_dispatch: # Permite disparo manual

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get commit hash for tagging
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

      - name: Remove Latest Tag (if exists)
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/espin:latest || true
          docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/espin:latest || true

      - name: Configurar SSH para acessar o Repo esppin
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ESPIN_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone Repo_esppin
        run: |
          git clone git@github.com:PNobreza/espin.git espin

      - name: Build Docker Image with Commit Tag
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/espin:${{ env.COMMIT_HASH }} -f ./docker/Dockerfile .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/espin:${{ env.COMMIT_HASH }} ${{ secrets.DOCKERHUB_USERNAME }}/espin:latest

      - name: Push Docker Image with Commit Tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/espin:${{ env.COMMIT_HASH }}

      - name: Push Docker Image with Latest Tag
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/espin:latest
